<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>SkillRadar</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #07111f;
        color: #d7e6f5;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      .wrap {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
      }
      .pulse {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: #3ec6ff;
        box-shadow: 0 0 24px #3ec6ff;
        animation: pulse 1.2s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 0.7; }
        50% { transform: scale(1.35); opacity: 1; }
      }
      h1 { margin: 8px 0 0; font-size: 22px; }
      p { margin: 0; color: #8aa4c7; font-size: 13px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="pulse"></div>
      <h1>SkillRadar</h1>
      <p id="msg">正在启动桌面应用与本地 API…</p>
    </div>
  </body>
</html>
